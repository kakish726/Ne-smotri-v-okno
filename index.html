<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>НЕ СМОТРИ В ОКНО</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;}
  #game{display:block;width:100vw;height:100vh;cursor:crosshair;}
  #clock{position:fixed;top:12px;right:16px;color:#ff2222;font-size:36px;letter-spacing:3px;
    text-shadow:0 0 10px #f00;user-select:none;z-index:5;}
  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#c11;font-size:24px;
    letter-spacing:3px;user-select:none;opacity:0;z-index:5;white-space:nowrap;}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.93);color:#999;text-align:center;z-index:10;padding:24px;}
  #overlay h1{color:#b22;font-size:46px;letter-spacing:5px;margin:0 0 14px;text-shadow:0 0 14px #500;}
  #overlay p{max-width:560px;line-height:1.55;font-size:17px;margin:6px 0;}
  #overlay .sub{color:#666;font-size:14px;}
  .btn{margin-top:24px;padding:13px 38px;font-size:20px;font-family:inherit;background:#160000;color:#c44;
    border:1px solid #611;cursor:pointer;letter-spacing:2px;}
  .btn:hover{background:#2a0000;color:#f66;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="clock">00:00</div>
<div id="hint">НЕ СМОТРИ В ОКНО</div>
<div id="overlay">
  <h1 id="ovTitle">НЕ СМОТРИ В ОКНО</h1>
  <p id="ovText">Ты один в тёмной комнате. Ночь будет длинной.<br>
  Время от времени кто-то будет смотреть на тебя через окно —
  и голос скажет: «Не смотри в окно».</p>
  <p class="sub">Правила: когда слышишь голос — убери курсор (палец) от окна.
  Если посмотришь — оно увидит тебя. Доживи до 06:00.</p>
  <button class="btn" id="startBtn">НАЧАТЬ НОЧЬ</button>
</div>
<script>
const cv = document.getElementById('game'), cx = cv.getContext('2d');
const clockEl = document.getElementById('clock');
const hintEl = document.getElementById('hint');
const ovEl = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');

let W, H, winRect, tvRect;
function resize(){
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  winRect = {x: W*0.64, y: H*0.14, w: W*0.30, h: H*0.46};
  tvRect  = {x: W*0.15, y: H*0.36, w: W*0.30, h: H*0.26};
}
addEventListener('resize', resize); resize();

// ---------- состояние ----------
let mode = 'menu';      // menu | play | scare | over | win
let playT = 0;          // игровые секунды (1 сек = 1 игровая минута)
let evActive = false, evEnd = 0, nextEv = 0;
let tvFace = 0, scareT = 0, scareSeed = 0;
const mouse = {x:-1, y:-1};
const DAY = 360; // 6 игровых часов = 360 минут

// ---------- звёзды за окном ----------
const stars = [];
for (let i = 0; i < 45; i++) stars.push({fx: Math.random(), fy: Math.random()*0.7, s: Math.random()*1.6+0.4, p: Math.random()*6.28});

// ---------- шум телевизора ----------
const nz = document.createElement('canvas'); nz.width = 160; nz.height = 100;
const nzx = nz.getContext('2d'); const nzd = nzx.createImageData(160, 100);
function fillNoise(){
  const d = nzd.data;
  for (let i = 0; i < d.length; i += 4){
    const v = (Math.random()*255)|0;
    d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 255;
  }
  nzx.putImageData(nzd, 0, 0);
}

// ---------- аудио ----------
let AC = null;
function initAudio(){
  if (AC) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = 48;
    const g = AC.createGain(); g.gain.value = 0.02;
    o.connect(g); g.connect(AC.destination); o.start();
    const len = AC.sampleRate*2, buf = AC.createBuffer(1, len, AC.sampleRate), dd = buf.getChannelData(0);
    for (let i = 0; i < len; i++) dd[i] = Math.random()*2-1;
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1600;
    const ng = AC.createGain(); ng.gain.value = 0.012;
    src.connect(f); f.connect(ng); ng.connect(AC.destination); src.start();
  }catch(e){}
}
function scream(){
  if (!AC) return;
  try{
    const t = AC.currentTime;
    const o = AC.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(950, t);
    o.frequency.exponentialRampToValueAtTime(110, t+1.2);
    const g = AC.createGain(); g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+1.4);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+1.5);
    const len = AC.sampleRate*1.2, b = AC.createBuffer(1, len, AC.sampleRate), dd = b.getChannelData(0);
    for (let i = 0; i < len; i++) dd[i] = (Math.random()*2-1)*(1-i/len);
    const s = AC.createBufferSource(); s.buffer = b;
    const g2 = AC.createGain(); g2.gain.value = 0.5;
    s.connect(g2); g2.connect(AC.destination); s.start(t);
  }catch(e){}
}
function speak(text){
  try{
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU'; u.rate = 0.7; u.pitch = 0.1; u.volume = 1;
    const vs = speechSynthesis.getVoices();
    const r = vs.find(v => /ru/i.test(v.lang));
    if (r) u.voice = r;
    speechSynthesis.speak(u);
  }catch(e){}
}

// ---------- события ----------
function scheduleNext(){ nextEv = playT + 11 + Math.random()*24; }
function startEvent(){
  evActive = true;
  evEnd = playT + 4 + Math.random()*3;
  speak('Не смотри в окно');
}
function inWin(x, y){
  return x > winRect.x && x < winRect.x+winRect.w && y > winRect.y && y < winRect.y+winRect.h;
}
function scare(){
  mode = 'scare'; scareT = 0; scareSeed = Math.random()*1000;
  scream();
  try{ speechSynthesis.cancel(); }catch(e){}
}

// ---------- отрисовка ----------
function drawRoom(){
  const g = cx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#08080c'); g.addColorStop(1, '#020202');
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  cx.fillStyle = '#0a0908'; cx.fillRect(0, H*0.8, W, H*0.2);
  cx.fillStyle = 'rgba(255,255,255,0.015)'; cx.fillRect(0, H*0.8, W, 2);
}
function drawMonsterFace(x, y, s, jit){
  if (jit){ x += (Math.random()-0.5)*jit; y += (Math.random()-0.5)*jit; }
  const sway = Math.sin(performance.now()/380 + scareSeed)*s*0.05;
  x += sway;
  cx.fillStyle = '#000';
  cx.beginPath(); cx.ellipse(x, y, s*0.78, s, 0, 0, 7); cx.fill();
  for (const dx of [-s*0.33, s*0.33]){
    const gx = x+dx, gy = y - s*0.14;
    const g = cx.createRadialGradient(gx, gy, 0, gx, gy, s*0.5);
    g.addColorStop(0, 'rgba(255,255,225,0.95)');
    g.addColorStop(0.28, 'rgba(255,255,190,0.5)');
    g.addColorStop(1, 'rgba(255,255,190,0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(gx, gy, s*0.5, 0, 7); cx.fill();
    cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(gx, gy, s*0.09, 0, 7); cx.fill();
  }
  cx.fillStyle = 'rgba(0,0,0,0.92)';
  cx.beginPath(); cx.ellipse(x, y+s*0.42, s*0.42, s*0.13, 0, 0, 7); cx.fill();
  cx.strokeStyle = 'rgba(255,255,255,0.8)'; cx.lineWidth = Math.max(1.5, s*0.02);
  cx.beginPath();
  cx.moveTo(x-s*0.44, y+s*0.36);
  for (let i = 0; i <= 10; i++){
    const px = x - s*0.44 + (i/10)*s*0.88;
    const py = y + s*0.36 + (i%2 ? s*0.09 : 0);
    cx.lineTo(px, py);
  }
  cx.stroke();
}
function drawWindow(){
  const r = winRect;
  const g = cx.createLinearGradient(0, r.y, 0, r.y+r.h);
  g.addColorStop(0, '#0a0f2a'); g.addColorStop(1, '#131c3e');
  cx.fillStyle = g; cx.fillRect(r.x, r.y, r.w, r.h);
  for (const st of stars){
    const tw = 0.5 + 0.5*Math.sin(performance.now()/700 + st.p);
    cx.fillStyle = 'rgba(220,225,255,' + (0.25 + 0.5*tw) + ')';
    cx.fillRect(r.x + st.fx*r.w, r.y + st.fy*r.h, st.s, st.s);
  }
  const moonR = Math.min(r.w, r.h)*0.07;
  cx.fillStyle = '#c9d2e4';
  cx.beginPath(); cx.arc(r.x + r.w*0.74, r.y + r.h*0.2, moonR, 0, 7); cx.fill();
  cx.fillStyle = '#0a0f2a';
  cx.beginPath(); cx.arc(r.x + r.w*0.74 - moonR*0.4, r.y + r.h*0.2 - moonR*0.25, moonR*0.85, 0, 7); cx.fill();
  if (evActive) drawMonsterFace(r.x + r.w/2, r.y + r.h*0.55, Math.min(r.w, r.h)*0.3, 0);
  cx.fillStyle = '#0c0c0c';
  cx.fillRect(r.x + r.w/2 - 5, r.y, 10, r.h);
  cx.fillRect(r.x, r.y + r.h/2 - 5, r.w, 10);
  cx.strokeStyle = '#181818'; cx.lineWidth = 12; cx.strokeRect(r.x, r.y, r.w, r.h);
  cx.strokeStyle = '#262626'; cx.lineWidth = 2; cx.strokeRect(r.x+6, r.y+6, r.w-12, r.h-12);
}
function drawTV(){
  const r = tvRect;
  cx.fillStyle = 'rgba(140,170,255,0.04)';
  cx.beginPath(); cx.ellipse(r.x + r.w/2, H*0.82, r.w*0.8, H*0.1, 0, 0, 7); cx.fill();
  cx.fillStyle = '#131313';
  cx.fillRect(r.x - r.w*0.07, r.y - r.h*0.09, r.w*1.14, r.h*1.2);
  cx.fillStyle = '#1c1c1c';
  cx.fillRect(r.x - r.w*0.03, r.y + r.h*1.12, r.w*1.06, r.h*0.08);
  cx.drawImage(nz, r.x, r.y, r.w, r.h);
  if (tvFace > 0){
    drawMonsterFace(r.x + r.w/2, r.y + r.h/2, r.h*0.34, 0);
    tvFace -= 1;
  } else if (Math.random() < 0.0035){
    tvFace = 2;
  }
  cx.fillStyle = 'rgba(0,0,0,0.22)';
  for (let yy = r.y; yy < r.y + r.h; yy += 4) cx.fillRect(r.x, yy, r.w, 2);
  cx.strokeStyle = '#0a0a0a'; cx.lineWidth = 6; cx.strokeRect(r.x, r.y, r.w, r.h);
}
function drawVignette(){
  const vg = cx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.22, W/2, H/2, Math.max(W,H)*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.92)');
  cx.fillStyle = vg; cx.fillRect(0, 0, W, H);
}
function render(){
  if (mode === 'scare'){
    const k = 1 + scareT*2.2;
    cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H);
    cx.save();
    cx.globalAlpha = Math.min(1, 0.4 + scareT*3);
    drawMonsterFace(W/2, H/2, Math.min(W,H)*0.3*k, 26);
    cx.restore();
    cx.fillStyle = 'rgba(120,0,0,' + (0.15 + scareT*0.4) + ')';
    cx.fillRect(0, 0, W, H);
    return;
  }
  drawRoom();
  drawWindow();
  drawTV();
  drawVignette();
}

// ---------- HUD ----------
function pad(n){ return (n < 10 ? '0' : '') + n; }
function updateClock(){
  const m = Math.min(359, Math.floor(playT));
  clockEl.textContent = pad(Math.floor(m/60)) + ':' + pad(m%60);
}

// ---------- главный цикл ----------
let last = 0;
function loop(ts){
  const dt = Math.min(0.05, (ts - last)/1000); last = ts;
  if (mode === 'play'){
    playT += dt;
    fillNoise();
    if (!evActive && playT >= nextEv) startEvent();
    if (evActive){
      if (playT >= evEnd){ evActive = false; scheduleNext(); }
      else if (inWin(mouse.x, mouse.y)) scare();
    }
    if (playT >= DAY){ mode = 'win'; showWin(); }
    hintEl.style.opacity = evActive ? (0.55 + 0.45*Math.abs(Math.sin(ts/180))) : 0;
    updateClock();
  } else if (mode === 'scare'){
    scareT += dt;
    if (scareT > 1.6){ mode = 'over'; showOver(); }
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- ввод ----------
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('pointerdown', e => {
  if (mode === 'play' && evActive && inWin(e.clientX, e.clientY)) scare();
});

// ---------- экраны ----------
function showOverlay(title, text, btnLabel){
  ovTitle.textContent = title;
  ovText.innerHTML = text;
  document.getElementById('startBtn').textContent = btnLabel;
  ovEl.classList.remove('hidden');
}
function hideOverlay(){ ovEl.classList.add('hidden'); }
function showOver(){
  showOverlay('ОНО УВИДЕЛО ТЕБЯ',
    'Ты посмотрел в окно.<br>Продержался до ' + clockEl.textContent + '.<br>Ночь не простила второй раз.',
    'ПОПРОБОВАТЬ СНОВА');
}
function showWin(){
  showOverlay('06:00 — УТРО',
    'Серый свет вытеснил тьму. В окне больше никого нет.<br>Ты дожил до утра.',
    'ЕЩЁ ОДНА НОЧЬ');
}
document.getElementById('startBtn').addEventListener('click', () => {
  hideOverlay();
  initAudio();
  try{ speechSynthesis.getVoices(); }catch(e){}
  mode = 'play'; playT = 0; evActive = false;
  nextEv = 8 + Math.random()*7;
  updateClock();
});
</script>
</body>
</html>
