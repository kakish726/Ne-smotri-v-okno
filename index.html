<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;
    font-family:'Courier New',monospace;color:#fff;-webkit-user-select:none;user-select:none;}
  #splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#2a0505 0%,#000 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center;}
  #splash h1{font-size:clamp(2rem,8vw,4.5rem);letter-spacing:4px;color:#ff2b2b;
    text-shadow:0 0 25px #ff0000;animation:flick 2.5s infinite;margin:0 10px;}
  #splash p{color:#999;font-size:1.1rem;margin:14px 20px 30px;line-height:1.5;}
  #btn-start{padding:18px 46px;font-size:1.6rem;letter-spacing:3px;background:#000;color:#ff2b2b;
    border:3px solid #ff2b2b;cursor:pointer;text-transform:uppercase;}
  #btn-start:hover{background:#ff2b2b;color:#000;box-shadow:0 0 30px #ff0000;}
  @keyframes flick{0%,100%{opacity:1}45%{opacity:.85}47%{opacity:.4}49%{opacity:.9}}
  #ui{display:none;position:fixed;inset:0;}
  #hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 16px;z-index:5;font-size:1.4rem;text-shadow:1px 1px 2px #000;}
  canvas{display:block;position:absolute;inset:0;}
  #pad{position:absolute;bottom:18px;left:18px;z-index:6;display:none;
    grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px;}
  .pad-btn{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:1.4rem;touch-action:none;}
  .pad-btn:active{background:rgba(255,43,43,.5);}
  #gameover,#win{display:none;position:fixed;inset:0;z-index:60;background:#000;
    flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  #gameover h2{color:#ff2b2b;font-size:3rem;text-shadow:0 0 30px #f00;}
  #win h2{color:#7CFC00;font-size:3rem;text-shadow:0 0 30px #0f0;}
  .again{margin-top:24px;padding:14px 36px;font-size:1.2rem;background:#000;color:#fff;
    border:2px solid #fff;cursor:pointer;}
  @media (pointer:coarse){#pad{display:grid}}
</style>
</head>

</div>
