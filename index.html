<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>НЕ СМОТРИ В ОКНО</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Creepster', cursive;
            color: #fff;
            user-select: none;
        }

        /* --- ЗАСТАВКА --- */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a0505 0%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
        }

        h1 {
            font-size: 5rem;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
            margin-bottom: 20px;
            text-align: center;
            animation: glitch 3s infinite;
        }

        .btn-start {
            padding: 20px 50px;
            font-size: 2rem;
            background: #000;
            color: #ff0000;
            border: 4px solid #ff0000;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-start:hover {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 30px #ff0000;
        }

        /* --- ИГРОВОЙ ЭКРАН --- */
        #game-ui {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Чтобы клики проходили сквозь интерфейс */
        }

        #clock {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            z-index: 5;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            color: #ffaa00;
            text-shadow: 1px 1px 0 #000;
            z-index: 5;
        }

        /* --- 3D МИР (CANVAS) --- */
        canvas {
            display: block;
            cursor: crosshair;
        }

        /* --- МОБИЛЬНОЕ УПРАВЛЕНИЕ --- */
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 300px;
            pointer-events: auto;
            z-index: 10;
        }

        .control-group {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 2rem;
            user-select: none;
        }

        #btn-up { top: 100px; left: 50%; transform: translateX(-50%); }
        #btn-down { top: 100px; right: 50px; }
        #btn-left { top: 100px; left: 50px; }
        #btn-right { top: 100px; right: 150px; }

        .action-btn {
            position: absolute;
            bottom: 50px;
            right: 50px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #ff0000;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            border: 2px solid white;
        }

        /* --- СКРИМЕРЫ --- */
        #screamer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #screamer-overlay img {
            max-width: 90%;
            max-height: 90%;
            filter: sepia(100%) invert(100%) contrast(100%) brightness(100%);
        }

        @keyframes glitch {
            0% { text-shadow: 0 0 10px #ff0000; }
            50% { text-shadow: 0 0 10px #00ff00; }
            100% { text-shadow: 0 0 10px #ff00ff; }
        }

        /* Адаптив для мобильных */
        @media (max-width: 768px) {
            #mobile-controls { display: block; }
            h1 { font-size: 3rem; }
        }
    </style>
</head>

    const textures = {};
    
    function createTexture(color, pattern) {
        const tex = document.createElement('canvas');
        tex.width = 64;
        tex.height = 64;
        const tCtx = tex.getContext('2d');
        
        // Цвет стены
        tCtx.fillStyle = color;
        tCtx.fillRect(0, 0, 64, 64);

            tCtx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<64; i+=16) {
                tCtx.fillRect(i, 0, 4, 64);
            }
        }
        // Кирпич для окна

            tCtx.fillStyle = '#333';
            tCtx.fillRect(0,0,64,64);
            tCtx.fillStyle = '#555';

                for(let c=0; c<4; c++) {
                    if((r+c)%2===0) tCtx.fillRect(c*16, r*16, 16, 16);
                }
            }
        }
        return tex;
    }
